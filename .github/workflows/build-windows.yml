name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve application version
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DIST_NAME=USPSBatchRegistration-v$version-Windows-x64" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pyinstaller

      - name: Run quality checks
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check .
          python -m pytest -q

      - name: Install bundled Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD ".playwright-browsers"
          python -m playwright install chromium

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean usps-keygen.spec
          Copy-Item -Recurse -Force ".playwright-browsers" "dist\USPSBatchRegistration\playwright-browsers"
          Copy-Item -Force "README.md" "dist\USPSBatchRegistration\README.md"
          Copy-Item -Force "registrations_template.csv" "dist\USPSBatchRegistration\registrations_template.csv"
          Rename-Item "dist\USPSBatchRegistration\USPSBatchRegistration.exe" `
            "USPSBatchRegistration-v$env:APP_VERSION.exe"
          Rename-Item "dist\USPSBatchRegistration" $env:DIST_NAME

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = "dist\$env:DIST_NAME\USPSBatchRegistration-v$env:APP_VERSION.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not created" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "Executable is unexpectedly small" }
          if (-not (Test-Path "dist\$env:DIST_NAME\playwright-browsers")) {
            throw "Bundled Chromium is missing"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\$env:DIST_NAME" `
            -DestinationPath "dist\$env:DIST_NAME.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_NAME }}
          path: dist/${{ env.DIST_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.DIST_NAME }}.zip
          generate_release_notes: true
